name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lesson tests
        run: node tests/lessons.test.mjs
      - name: Practice agent script parses
        run: sh -n mods/dojo/demo-agent.sh
      - name: Mod folder has no layouts/ (the gallery would list it as a layout)
        run: test ! -d mods/dojo/layouts
